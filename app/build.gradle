plugins {
    id "com.android.application"
}

android {
    namespace "com.example.loopingtvplayer"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.example.loopingtvplayer"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "2.0.1"
    }
    signingConfigs {
        release {
            def path = System.getenv("MEYDAN_KEYSTORE")
            if (path) {
                storeFile file(path)
                storePassword System.getenv("MEYDAN_STORE_PASSWORD")
                keyAlias "meydan-tv"
                keyPassword System.getenv("MEYDAN_STORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            if (System.getenv("MEYDAN_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
